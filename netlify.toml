# Netlify 배포 설정 — Vercel(vercel.json)과 같은 구성을 옮긴 것.
#
# 백엔드가 CORS를 열지 않아서 브라우저가 직접 못 부른다.
# 그래서 앱은 상대 경로 /backend 를 부르고, 여기 프록시가 실제 주소로 넘긴다.
# ngrok 주소가 바뀌면 아래 to 와 vercel.json 두 곳을 함께 고쳐야 한다.

[build]
  command = "npm run build"
  publish = "dist"

# VITE_ 변수는 빌드 결과물에 그대로 박히는 공개 값이라 여기 둬도 된다.
# (대시보드에서 따로 설정할 필요가 없다)
[build.environment]
  VITE_API_URL = "/backend"
  VITE_SQUAD_ID = "77c7ba94-fa87-4b2b-b7cc-f7b01540cd8a"

# 순서가 중요하다. SPA 폴백보다 먼저 와야 /backend 가 index.html로 삼켜지지 않는다.
[[redirects]]
  from = "/backend/*"
  to = "https://ee2c-106-101-130-74.ngrok-free.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
